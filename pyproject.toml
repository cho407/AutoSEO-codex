[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "autoseo-codex"
version = "0.4.0rc1"
description = "Free open-source SEO, AEO, GEO, LLMO, NEO, and Naver workflows for Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "cho407" }]
keywords = ["seo", "aeo", "geo", "llmo", "neo", "naver", "codex", "search"]

[project.urls]
Homepage = "https://github.com/cho407/AutoSEO-codex"
Repository = "https://github.com/cho407/AutoSEO-codex"
Issues = "https://github.com/cho407/AutoSEO-codex/issues"

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.12.0,<5",
  "pytest>=9.1.1,<10",
  "PyYAML>=6.0.3,<7",
  "requests>=2.32.4,<3",
  "ruff>=0.16.4,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools]
packages = []
